name: CoDo Harmonica issue 58 cloud validation
on:
  push:
    branches: [codo-harmonica-i58-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout CoDo test patch
        uses: actions/checkout@v4
      - name: Checkout exact public Harmonica source
        uses: actions/checkout@v4
        with:
          repository: harmonicabot/harmonica-web-app
          ref: 6b57ef8d7031a99e8977ec5a2e7556647fb3a1b2
          path: upstream
          persist-credentials: false
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Install contribution on actual upstream checkout
        run: |
          set -euo pipefail
          cp -a experiments/harmonica-i58/patch/. upstream/
          chmod +x upstream/scripts/local-setup.sh
          cd upstream
          git diff --check
          bash -n scripts/local-setup.sh
          echo "Installed patch; verifying actual Docker services next."
      - name: Bring up real PostgreSQL and Qdrant
        working-directory: upstream
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          bash scripts/local-setup.sh up
          docker compose --env-file .env ps
      - name: Verify live Qdrant collection and vector round-trip
        run: |
          set -euo pipefail
          curl -fsS -X PUT 'http://127.0.0.1:6333/collections/codo_e02_smoke' -H 'Content-Type: application/json' -d '{"vectors":{"size":3,"distance":"Cosine"}}'
          curl -fsS -X PUT 'http://127.0.0.1:6333/collections/codo_e02_smoke/points?wait=true' -H 'Content-Type: application/json' -d '{"points":[{"id":1,"vector":[0.1,0.2,0.3]}]}'
          curl -fsS 'http://127.0.0.1:6333/collections/codo_e02_smoke/points/1' | grep -q '"id":1'
          curl -fsS -X DELETE 'http://127.0.0.1:6333/collections/codo_e02_smoke'
          echo "Qdrant create/upsert/read/delete round-trip succeeded."
      - name: Install upstream Node dependencies
        working-directory: upstream
        run: npm install --no-audit --no-fund
      - name: Execute actual Kysely migrations on local PostgreSQL
        working-directory: upstream
        run: |
          set -euo pipefail
          bash scripts/local-setup.sh migrate
          docker compose --env-file .env exec -T postgres sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "select count(*) from information_schema.tables;"'
      - name: Start Next.js and record HTTP behavior without Auth0 credentials
        working-directory: upstream
        run: |
          set -euo pipefail
          npm run dev > /tmp/codo-harmonica-dev.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          code=000
          for attempt in $(seq 1 45); do
            code=$(curl --max-time 3 -sS -o /tmp/codo-harmonica-body.html -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [[ "$code" != 000 && -n "$code" ]]; then break; fi
            sleep 2
          done
          echo "curl default-agent root HTTP status: $code (may be bot rewrite)"
          browser_code=$(curl --max-time 20 -sS -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36' -D /tmp/codo-browser-headers -o /tmp/codo-browser-body -w '%{http_code}' http://127.0.0.1:3000/ || true)
          echo "Browser-like root HTTP status: $browser_code"
          grep -i -E '^location:' /tmp/codo-browser-headers || true
          echo "Dev server excerpt:"
          tail -40 /tmp/codo-harmonica-dev.log
          if [[ "$code" = 000 ]]; then echo "App HTTP smoke: no reachable response"; exit 1; fi
          if [[ "$code" = 500 ]]; then echo "App HTTP smoke: 500; expected possible Auth0 blocker, not full success"; fi
          echo "App HTTP request was executed; full authenticated workflow remains out of scope."
      - name: Show live service diagnostics
        if: always()
        working-directory: upstream
        run: |
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --no-color --tail=35 postgres qdrant || true
