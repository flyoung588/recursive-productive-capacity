name: harmonica-oss-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harmonica
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run scripts/local-setup.sh up first}
      POSTGRES_DB: harmonica
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - harmonica_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmonica -d harmonica"]
      interval: 3s
      retries: 20
      timeout: 3s
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - harmonica_qdrant_data:/qdrant/storage

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - harmonica_ollama_data:/root/.ollama
volumes:
  harmonica_pg_data:
  harmonica_qdrant_data:
  harmonica_ollama_data:
